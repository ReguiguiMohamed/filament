syntax = "proto3";

package catalog.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/connectors.proto";

// CatalogService is the internal surface a connector host serves so the
// control binaries never link a driver. It mirrors the filament.Catalog
// interface and is not part of the public API.
//
// Specs and plans are this package's own messages: they carry the planning
// facts the public ConnectorSpec omits. Discovered resources and columns are
// the public ingestion.v1 messages, passed through to the UI as they are.
service CatalogService {
  // Describe returns connector specs and driver contracts. They are fixed for
  // the life of the host process.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // PlanReplicationStream asks a streaming source to plan its consumer.
  rpc PlanReplicationStream(PlanReplicationStreamRequest) returns (PlanReplicationStreamResponse);
  // Validate runs the connector's pure config validation.
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  // TestConnection runs the connector's live probe.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  // Discover configures the source and lists its resources.
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  // Inspect configures the source once and reports each resource's primary
  // key and columns.
  rpc Inspect(InspectRequest) returns (InspectResponse);
}

// ReadMode is filament.ReadMode.
enum ReadMode {
  READ_MODE_UNSPECIFIED = 0;
  READ_MODE_FULL = 1;
  READ_MODE_INCREMENTAL = 2;
  READ_MODE_CDC = 3;
}

// Operation is filament.Operation.
enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_INSERT = 1;
  OPERATION_UPDATE = 2;
  OPERATION_DELETE = 3;
}

// Connector is one registered connector as the catalog describes it.
message Connector {
  ingestion.v1.ConnectorKind kind = 1;
  // name is the lookup name: an alias in a listing, the concrete name when
  // asked for one connector.
  string name = 2;
  oneof spec {
    SourceSpec source = 3;
    SinkSpec sink = 4;
  }
  // plans_streams is set when a source implements ReplicationStreamPlanner.
  bool plans_streams = 5;
  // streams is set when a source implements StreamSource or a sink implements
  // StreamingSink.
  bool streams = 6;
}

// SourceSpec is filament.ConnectorSpec.
message SourceSpec {
  string name = 1;
  string alias_target = 2;
  string display_name = 3;
  string description = 4;
  string dark_logo_url = 5;
  string light_logo_url = 6;
  string version = 7;
  string api_version = 8;
  ingestion.v1.ConnectorMaturity maturity = 9;
  repeated ReadMode modes = 10;
  repeated SourcePolicy source_policies = 11;
  ingestion.v1.ConfigSchema config = 12;
  ResourceCapabilities resources = 13;
  // stream is unset for sources without continuous input.
  StreamCapabilities stream = 14;
}

// SourcePolicy is filament.SourcePolicy.
message SourcePolicy {
  ReadMode mode = 1;
  repeated Operation emits_ops = 2;
  bool ordered = 3;
  string checkpointing = 4;
}

// ResourceCapabilities is filament.ResourceCapabilities.
message ResourceCapabilities {
  bool discoverable = 1;
  bool per_resource_cursor = 2;
}

// StreamCapabilities is filament.StreamCapabilities.
message StreamCapabilities {
  repeated Operation emits_ops = 1;
  string input = 2;
  repeated string ordering = 3;
  string delivery = 4;
}

// SinkSpec is filament.SinkSpec.
message SinkSpec {
  string name = 1;
  string display_name = 2;
  string description = 3;
  string dark_logo_url = 4;
  string light_logo_url = 5;
  string version = 6;
  ingestion.v1.ConnectorMaturity maturity = 7;
  ingestion.v1.ConfigSchema config = 8;
  SinkCapabilities capabilities = 9;
  string schema_field = 10;
}

// SinkCapabilities is filament.SinkCapabilities.
message SinkCapabilities {
  // stream is unset for sinks without epoch writes.
  StreamingSinkCapabilities stream = 1;
  bool transactional = 2;
  bool schematized = 3;
  bool encoded_integrity = 4;
  repeated WritePolicyCapability write_policies = 5;
  int64 preferred_batch_rows = 6;
  int64 preferred_batch_bytes = 7;
  google.protobuf.Duration preferred_flush_interval = 8;
}

// StreamingSinkCapabilities is filament.StreamingSinkCapabilities.
message StreamingSinkCapabilities {
  repeated WritePolicyCapability write_policies = 1;
  bool owner_fencing = 2;
  bool isolated_epochs = 3;
  // in_flight_bound is unset when unknown.
  google.protobuf.Duration in_flight_bound = 4;
}

// WritePolicyCapability is filament.WritePolicyCapability.
message WritePolicyCapability {
  string mode = 1;
  bool requires_pk = 2;
  bool requires_order = 3;
  repeated Operation accepts_ops = 4;
  string atomicity = 5;
  string durability = 6;
}

// ReplicationStreamPlan is filament.ReplicationStreamPlan.
message ReplicationStreamPlan {
  repeated string resources = 1;
  string consumer_name = 2;
  google.protobuf.Struct consumer_config = 3;
  google.protobuf.Struct continuity_config = 4;
}

message DescribeRequest {
  // kind narrows the listing. It is required when name is set.
  ingestion.v1.ConnectorKind kind = 1;
  // name selects one connector and resolves aliases. Empty lists every
  // registered connector.
  string name = 2;
}

message DescribeResponse {
  repeated Connector connectors = 1;
}

message PlanReplicationStreamRequest {
  string source = 1;
  string replication_stream_id = 2;
  string source_connection_id = 3;
  google.protobuf.Struct config = 4;
  repeated string resources = 5;
}

message PlanReplicationStreamResponse {
  ReplicationStreamPlan plan = 1;
}

message ValidateRequest {
  ingestion.v1.ConnectorKind kind = 1;
  string name = 2;
  google.protobuf.Struct config = 3;
}

message ValidateResponse {
  // failure is the connector's verdict. Empty means the config is valid.
  string failure = 1;
}

message TestConnectionRequest {
  ingestion.v1.ConnectorKind kind = 1;
  string name = 2;
  google.protobuf.Struct config = 3;
}

message TestConnectionResponse {
  // failure is the probe's verdict. Empty means the connection works.
  string failure = 1;
}

message DiscoverRequest {
  string source = 1;
  google.protobuf.Struct config = 2;
  bool refresh = 3;
}

message DiscoverResponse {
  repeated ingestion.v1.Resource resources = 1;
}

message InspectRequest {
  string source = 1;
  google.protobuf.Struct config = 2;
  // resources to inspect. Empty inspects every selectable discovered resource.
  repeated string resources = 3;
}

message ResourceInspection {
  string name = 1;
  repeated string primary_key = 2;
  // primary_key_error is a failed schema read. The key is then unknown.
  string primary_key_error = 3;
  repeated ingestion.v1.ResourceColumn columns = 4;
  // ranked marks the columns as annotated with cursor eligibility.
  bool ranked = 5;
  string columns_error = 6;
  // columns_unsupported is set when the source exposes neither cursor columns
  // nor a schema.
  bool columns_unsupported = 7;
  // managed_incremental marks a resource whose incremental state the source
  // owns, so it needs no cursor column.
  bool managed_incremental = 8;
}

message InspectResponse {
  repeated ResourceInspection resources = 1;
}
