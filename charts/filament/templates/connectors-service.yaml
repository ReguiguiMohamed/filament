apiVersion: v1
kind: Service
metadata:
  name: {{ include "filament.connectors.fullname" . }}
  namespace: {{ include "filament.namespace" . }}
  labels:
    {{- include "filament.connectors.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.connectors.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "filament.connectors.selectorLabels" . | nindent 4 }}
